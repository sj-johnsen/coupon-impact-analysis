[project]
name = "coupon-analysis"
version = "1.0.0"
description = "Causal impact of the 500 yen and 3000 yen coupons (Topics in Econometrics B, Assignment 1)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "rdrobust>=1.3",
    "rddensity>=1.0",
    "markdown>=3.6",
    "pygments>=2.18",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coupon_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
